[package]
name = "gruxi"
description = "Gruxi is a lightweight, modern web server focused on predictable performance under real-world traffic. It’s designed to serve static assets efficiently and provide a clean foundation for handling dynamic routes, reverse proxying, and API workloads without unnecessary overhead. It includes solid PHP support for both production and local development. For more information visit https://gruxi.org"
version = "0.3.0"
edition = "2024"

[dependencies]
hyper = { version = "1", features = ["server", "http1", "http2"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs", "io-util", "time", "sync", "macros", "process", "signal"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "http2", "client", "client-legacy"] }
sqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.141"
mime_guess = "2.0.5"
futures = "0.3.31"
bcrypt = "0.15"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1.0"
tls-listener = { version = "0.11", features = ["rustls-core", "rustls-ring", "rt", "tokio-net"] }
rcgen = { version = "0.14", features = ["ring", "pem"] }
rand = "0.9.2"
clap = "4.5.48"
cached = "0.56.0"
num_cpus = "1.17.0"
rustls-pemfile = "2.2.0"
random_password_generator = "0.1.0"
tokio-util = "0.7.17"
tokio-stream = { version = "0.1.17", features = ["net"] }
rustls-pki-types = "1.13.1"
http = "1.4.0"
hyper-rustls = { version = "0.27.7", features = ["http1", "http2", "native-tokio", "tls12", "logging"] }
rustls = "0.23.35"
rustls-native-certs = "0.8.3"
webpki-roots = "1.0.4"
dashmap = "6.1.0"
crossbeam-channel = "0.5"
urlencoding = "2.1.3"
unicode-normalization = "0.1.25"
unicode-general-category = "1.1.0"
email_address = "0.2.9"
psl = "2.1.180"
rustls-acme = { version = "0.15.1", features = ["tokio", "aws-lc-rs", "webpki-roots"] }
httpdate = "1.0.3"
arc-swap = "1.8.1"
qsu = { version = "0.7", features = ["rt", "tokio", "installer", "clap", "systemd"] }

[lib]
name = "gruxi"
path = "src/lib.rs"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports", "cargo_bench_support"] }
tokio-rustls = "0.26"

# ------------------------------------------------------------------------------
# DEBIAN (.deb) PACKAGING
# ------------------------------------------------------------------------------
[package.metadata.deb]
name = "gruxi"
maintainer = "Gruxi team <contact@gruxi.org>"
copyright = "Copyright (c) 2026, Daev.tech / Brian Søgård Jensen (contact@gruxi.org). All rights reserved."
priority = "optional"
section = "net"
license-file = ["LICENSE", "0"]
maintainer-scripts = "assets/pkg/debian/"
depends = "systemd"
assets = [
    [
        "target/release/gruxi",
        "/usr/bin/gruxi",
        "755",
    ],
    [
        "www-default/*",
        "/usr/share/gruxi/www-default",
        "644",
    ],
    [
        "www-admin/*",
        "/usr/share/gruxi/www-admin",
        "644",
    ],
    [
        "www-admin/assets/*",
        "/usr/share/gruxi/www-admin/assets",
        "644",
    ]
]
systemd-units = { unit-name = "gruxi", unit-scripts = "assets/pkg/systemd", enable = true }


#[[bench]]
#name = "gruxi"
#harness = false
