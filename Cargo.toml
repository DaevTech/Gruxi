[package]
name = "gruxi"
homepage = "https://gruxi.org"
description = "High‑performance web server"
version = "1.1.0"
license = "MIT"
edition = "2024"
rust-version = "1.96"

[dependencies]
hyper = { version = "1", features = ["server", "http1", "http2"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs", "io-util", "time", "sync", "macros", "process", "signal"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "http2", "client", "client-legacy"] }
sqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
mime_guess = "2.0"
futures = "0.3"
bcrypt = "0.19"
moka = { version = "0.12", features = ["future"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
flate2 = { version = "1.0", features = ["zlib-rs"], default-features = false }
tls-listener = { version = "0.11", features = ["rustls-core", "rustls-ring", "rt", "tokio-net"] }
rcgen = { version = "0.14", features = ["ring", "pem"] }
rand = "0.10"
clap = "4.5"
num_cpus = "1.17"
rustls-pemfile = "2.2"
random_password_generator = "0.1"
tokio-util = "0.7"
tokio-stream = { version = "0.1", features = ["net"] }
rustls-pki-types = "1.13"
http = "1.4"
hyper-rustls = { version = "0.27", features = ["http1", "http2", "native-tokio", "tls12", "logging"] }
rustls = "0.23"
rustls-native-certs = "0.8"
webpki-roots = "1.0"
dashmap = "6.1"
crossbeam-channel = "0.5"
urlencoding = "2.1"
unicode-normalization = "0.1"
unicode-general-category = "1.1"
email_address = "0.2"
psl = "2.1"
rustls-acme = { version = "0.15", features = ["tokio", "aws-lc-rs", "webpki-roots"] }
httpdate = "1.0"
arc-swap = "1.8"
# Service implementation
qsu = { version = "0.10", features = ["rt", "tokio", "installer", "clap", "systemd"] }
# Telemetry
opentelemetry = { version = "0.32", features = ["metrics"] }
opentelemetry_sdk = { version = "0.32", features = ["metrics", "rt-tokio"] }
opentelemetry-prometheus = "0.32"
prometheus = "0.14"

[lib]
name = "gruxi"
path = "src/lib.rs"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports", "cargo_bench_support"] }
tokio-rustls = "0.26"

# ------------------------------------------------------------------------------
# DEBIAN (.deb) PACKAGING
# ------------------------------------------------------------------------------
[package.metadata.deb]
name = "gruxi"
maintainer = "Gruxi team <contact@gruxi.org>"
copyright = "Copyright (c) 2026, Daev.tech / Brian Søgård Jensen (contact@gruxi.org). All rights reserved."
priority = "optional"
section = "net"
license-file = ["LICENSE", "0"]
maintainer-scripts = "scripts/pkg/debian/"
depends = "systemd"
assets = [
    [
        "target/release/gruxi",
        "/usr/bin/gruxi",
        "755",
    ],
    [
        "www-default/*",
        "/usr/share/gruxi/www-default",
        "644",
    ],
    [
        "www-admin/*",
        "/usr/share/gruxi/www-admin",
        "644",
    ],
    [
        "www-admin/assets/*",
        "/usr/share/gruxi/www-admin/assets",
        "644",
    ]
]
systemd-units = { unit-name = "gruxi", unit-scripts = "scripts/pkg/systemd", enable = true }

# ------------------------------------------------------------------------------
# Redhat/Fedora etc (.rpm) PACKAGING
# ------------------------------------------------------------------------------
[package.metadata.generate-rpm]
assets = [
    { source = "target/release/gruxi", dest = "/usr/bin/gruxi", mode = "755" },
    { source = "www-default/*", dest = "/usr/share/gruxi/www-default/", mode = "644" },
    { source = "www-admin/*", dest = "/usr/share/gruxi/www-admin/", mode = "644" },
    { source = "www-admin/assets/*", dest = "/usr/share/gruxi/www-admin/assets/", mode = "644" },
    { source = "scripts/pkg/systemd/gruxi.service", dest = "/usr/lib/systemd/system/gruxi.service", mode = "644" },
    { source = "scripts/pkg/systemd/gruxi.service", dest = "/opt/gruxi/systemd/gruxi.service", mode = "644" },
    { source = "scripts/pkg/rpm/postinst", dest = "/usr/share/gruxi/rpm/postinst", mode = "755" },
]
auto-req = "disabled"
post_install_script = "/usr/share/gruxi/rpm/postinst"

# Ensure that the useradd tool is present by depending on its package
[package.metadata.generate-rpm.requires]
shadow-utils = "*"


[[bench]]
name = "gruxi"
harness = false
