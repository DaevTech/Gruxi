name: release

on: workflow_dispatch

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            binary_ext: ''
            archive_suffix: linux-x64
            cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
            binary_ext: ''
            archive_suffix: linux-arm64
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            binary_ext: .exe
            archive_suffix: windows-x64
            cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            binary_ext: ''
            archive_suffix: mac-os-arm64
            cross: false
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive_ext: tar.gz
            binary_ext: ''
            archive_suffix: mac-os-x64
            cross: false

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v5

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        target: ${{ matrix.target }}

    - name: Install Cross-Compiler (Linux ARM64)
      if: matrix.cross
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: www-admin-src/package-lock.json

    - name: Build Admin Portal
      working-directory: www-admin-src
      run: |
        npm ci
        npm run build

    - name: Build Gruxi (Release)
      run: cargo build --release --target ${{ matrix.target }}
      env:
        CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

    - name: Extract version from Cargo.toml
      id: version
      shell: bash
      run: |
        VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/' | tr -d '\r')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

    - name: Prepare Release Directory
      shell: bash
      run: |
        mkdir -p release/gruxi
        mkdir -p release/gruxi/db
        mkdir -p release/gruxi/logs
        mkdir -p release/gruxi/certs
        mkdir -p release/gruxi/scripts
        cp target/${{ matrix.target }}/release/gruxi${{ matrix.binary_ext }} release/gruxi/
        cp -r www-admin release/gruxi/
        cp -r www-default release/gruxi/
        cp -r scripts release/gruxi/scripts
        cp README.md release/gruxi/
        cp LICENSE release/gruxi/

    - name: Create Linux Archive
      if: startsWith(matrix.target, 'x86_64-unknown-linux') || startsWith(matrix.target, 'aarch64-unknown-linux')
      working-directory: release
      run: tar -czf gruxi-${{ steps.version.outputs.version }}-${{ matrix.archive_suffix }}.tar.gz gruxi

    - name: Create macOS Archive
      if: startsWith(matrix.os, 'macos')
      working-directory: release
      run: tar -czf gruxi-${{ steps.version.outputs.version }}-${{ matrix.archive_suffix }}.tar.gz gruxi

    - name: Create Windows Archive
      if: matrix.os == 'windows-latest'
      working-directory: release
      shell: bash
      run: 7z a -tzip gruxi-${{ steps.version.outputs.version }}-${{ matrix.archive_suffix }}.zip gruxi

    - name: Install cargo-deb (Linux only)
      if: runner.os == 'Linux'
      run: cargo install cargo-deb

    - name: Build .deb package (Linux only)
      if: runner.os == 'Linux'
      run: cargo deb --no-build --target ${{ matrix.target }}

    - name: Install cargo-generate-rpm (Linux only)
      if: runner.os == 'Linux'
      run: cargo install cargo-generate-rpm

    - name: Build .rpm package (Linux only)
      if: runner.os == 'Linux'
      run: cargo generate-rpm --target ${{ matrix.target }}

    - name: Upload Release Artifact
      uses: actions/upload-artifact@v5
      with:
        name: gruxi-${{ matrix.archive_suffix }}
        path: release/gruxi-*.${{ matrix.archive_ext }}
        if-no-files-found: error

    - name: Upload .deb Artifact (Linux only)
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v5
      with:
        name: gruxi-deb-${{ matrix.archive_suffix }}
        path: target/${{ matrix.target }}/debian/*.deb
        if-no-files-found: error

    - name: Upload .rpm Artifact (Linux only)
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v5
      with:
        name: gruxi-rpm-${{ matrix.archive_suffix }}
        path: target/${{ matrix.target }}/generate-rpm/*.rpm
        if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Extract version from Cargo.toml
      id: version
      run: |
        VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/' | tr -d '\r')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

    - name: Download all artifacts
      uses: actions/download-artifact@v5
      with:
        path: artifacts

    - name: Collect release files
      run: |
        mkdir -p release-files
        find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} release-files/ \;
        echo "Release files:"
        ls -lh release-files/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: Gruxi v${{ steps.version.outputs.version }}
        draft: true
        files: release-files/*

  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v5

    - name: Extract version from Cargo.toml
      id: version
      run: |
        VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/' | tr -d '\r')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

    - uses: docker/setup-qemu-action@v3

    - uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        pull: true
        tags: |
          ghcr.io/daevtech/gruxi:latest
          ghcr.io/daevtech/gruxi:${{ steps.version.outputs.version }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.version=${{ steps.version.outputs.version }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha,scope=docker
        cache-to: type=gha,mode=max,scope=docker